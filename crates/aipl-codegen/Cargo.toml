[package]
name = "aipl-codegen"
version = "0.1.0"
edition = "2021"
description = "AIPL cranelift codegen (JIT and object emission)"
license = "MIT"
# Prebuilds the checked-in dogfood CLIF into an object linked into the binary.
build = "build.rs"

[dependencies]
# Shared with this crate's `build.rs`: linking a checked-in dogfood artifact
# into a cranelift module, one implementation for both the JIT and the
# build-time prebuilt object.
aipl-artifact = { workspace = true }
aipl-syntax = { workspace = true }
aipl-mono = { workspace = true }
# Used to parse the embedded `add.aipl` the compiler dogfoods via the FFI.
aipl-parser = { workspace = true }
# Used to *load* (parse + canonicalize builtin imports, resolve the
# `count_while` module import) the embedded `dedent.aipl` the compiler dogfoods
# via the FFI to de-dent raw strings.
aipl-loader = { workspace = true }
# The parser hook runs the dogfooded parser on a grown stack segment when the
# caller's is small: a recursive-descent parse of a large source needs several
# megabytes, and a test thread has two. See `parse_file`.
stacker = { workspace = true }
# Used to install the dogfooded `reindent_block` into the formatter's hook (the
# formatter's raw-block re-layout, dogfooded via the FFI); `install_parser_hooks`.
cranelift = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
cranelift-object = { workspace = true }
target-lexicon = { workspace = true }
# `dlopen`/`dlsym`/`flock` for the staged-IR shared library (`staged_library`).
libc = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# The build script reads the checked-in dogfood artifacts and archives them.
# The cranelift pieces that lowering needs live in `aipl-artifact`, which owns
# the one implementation the build script and the regeneration helpers share.
[build-dependencies]
aipl-artifact = { workspace = true }

[dev-dependencies]
# Cross-target ISA lookup, for `abi_spike.rs`: the regression tests for the Cranelift
# lowerings the 24-byte value ABI rests on (a three-word signature, an out pointer,
# and that x86-64 refuses a three-word return), which a Cranelift upgrade could change.
cranelift-codegen = { version = "0.134.2", features = ["all-arch"] }
