[package]
name = "aipl"
version = "0.1.0"
edition = "2021"
description = "AIPL language — facade crate tying the compiler crates together"
license = "MIT"

[workspace]
members = ["crates/*"]

# Warnings are errors, workspace-wide. Set here (rather than via `RUSTFLAGS`)
# because `[lints]` applies only to the crates in this workspace — `RUSTFLAGS`
# would also deny warnings inside dependencies, where we cannot fix them.
# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

# `warnings = "deny"` reaches rustdoc too. A genuinely unresolved link is a real
# error and stays denied; linking a *private* item from public docs is deliberate
# here — these docs explain internals and cross-reference them on purpose, and
# the alternatives (widening visibility, or dropping the reference) are both
# worse than a link that only resolves in `--document-private-items`.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

# Centralized dependency versions. Member crates opt in with
# `<dep> = { workspace = true }`; bump a version here and every crate
# that uses it follows. Internal path crates live here too so the path is
# written once (resolved relative to this workspace root).
[workspace.dependencies]
# Internal crates.
aipl-syntax = { path = "crates/aipl-syntax" }
aipl-parser = { path = "crates/aipl-parser" }
aipl-mono = { path = "crates/aipl-mono" }
aipl-codegen = { path = "crates/aipl-codegen" }
aipl-loader = { path = "crates/aipl-loader" }
aipl-linker = { path = "crates/aipl-linker" }
aipl-fmt = { path = "crates/aipl-fmt" }
# External crates.
cranelift = "0.134.2"
cranelift-jit = "0.134.2"
cranelift-module = "0.134.2"
cranelift-native = "0.134.2"
cranelift-reader = "0.134.2"
cranelift-object = "0.134.2"
object = "0.39"
target-lexicon = "0.13"
gazelle-parser = "0.9.3"
gazelle-macros = "0.9.3"
serde_json = "1"
regex = "1"

[dependencies]
aipl-syntax = { workspace = true }
aipl-parser = { workspace = true }
aipl-mono = { workspace = true }
aipl-codegen = { workspace = true }
aipl-loader = { workspace = true }
aipl-linker = { workspace = true }
aipl-fmt = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
regex = { workspace = true }
object = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "aipl"
path = "src/main.rs"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
missing_transmute_annotations = "allow"
large_enum_variant = "allow"
filter_map_bool_then = "allow"
needless_range_loop = "allow"
